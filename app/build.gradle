plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.bird2fish.travelbook'
    compileSdk 32

    defaultConfig {
        applicationId "com.bird2fish.travelbook"
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName "1.0"
        // 加上这个
//        ndk {
//            abiFilters 'armeabi-v7a', 'arm64-v8a'
//        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    dataBinding {
        enabled = true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.2.0'


    // 稳定、轻量、车机专用（4.3.1 / 4.4.1 二选一）
    // 车机 100% 稳定版，TencentMapInitializer 一定存在
    implementation 'com.tencent.map:tencent-map-vector-sdk:4.4.1'
    // 定位（替换成这个！）7.4.6版本以下不用隐私函数
    implementation 'com.tencent.map.geolocation:TencentLocationSdk-openplatform:7.2.6'

// 可选：工具包（配套 4.x 稳定）
    implementation 'com.tencent.map:sdk-utilities:1.0.5'

    // 地图
//    implementation 'com.tencent.map:tencent-map-vector-sdk:6.9.0.260312.237cbc9d.205120930'
//    // 基础库
//    implementation 'com.tencent.openmap:foundation:0.9.0.e5ea763'
//    // 地图组件库，包括小车平移、点聚合等组件功能，详见开发指南。
//    implementation 'com.tencent.map:sdk-utilities:1.0.12'
//    implementation 'com.tencent.map.geolocation:TencentLocationSdk-openplatform:7.6.1.7'

//    implementation files('libs\\tencent-mapsdk-android-official-release.5.2.1.18c8cd09.jar')
//    implementation files('libs\\TencentLocationSDK_v7.5.3.2_re68728c45_20230927114248_release.jar')
    // 地图组件库，包括小车平移、点聚合等组件功能，详见开发指南。
    //implementation 'com.tencent.map:sdk-utilities:1.0.9'

    implementation 'androidx.annotation:annotation:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'
    // Kotlin
    def coroutinesVersion = "1.5.2"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"

    // 图片浏览器
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    //implementation "com.google.android.material:material:1.4.0"

    // okhttp3.14.2
    //implementation 'com.squareup.okhttp3:okhttp:3.14.2'
    implementation "com.squareup.okhttp3:okhttp:4.9.1"
    implementation 'com.squareup.picasso:picasso:2.8'

    //implementation("com.github.kittinunf.fuel:fuel:3.0.0-alpha1")

    // Gson
    implementation 'com.google.code.gson:gson:2.9.0'

}